    statement => "
SELECT
CASE WHEN CC_ID_SenderOutbox IS NULL THEN CC_ID_SenderInbox ELSE CC_ID_SenderOutbox END AS [SenderID],
CASE WHEN CC_ID_RecipientOutbox IS NULL THEN CC_ID_RecipientInbox ELSE CC_ID_RecipientOutbox END AS [RecipientID],
AM_Status AS [Status],
AM_ArchivedUTC AS [ArchivedUTC],
AM_ReceivedFromSenderUTC AS [ReceivedFromSenderUTC],
CASE WHEN AM_SentToRecipientUTC IS NULL THEN AM_ReceivedFromSenderUTC ELSE AM_SentToRecipientUTC END AS [SentToRecipientUTC],
AM_InboxMessageTrackingID AS [TrackingID],
DATEDIFF(SECOND, AM_ReceivedFromSenderUTC, ISNULL(AM_SentToRecipientUTC, AM_ReceivedFromSenderUTC)) AS [DeliveryTimeInSec]
FROM [eHubArchiveOnline].[dbo].[eHubArchiveMessageExp]
WHERE 1=1
AND (CC_ID_SenderInbox = 'NZCustoms' OR CC_ID_RecipientInbox = 'NZCustoms')
AND AM_ReceivedFromSenderUTC >= '2018-04-01'
"

syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message BillingTransaction {
	int32 billable_count = 1;
	google.protobuf.StringValue category = 2;
	google.protobuf.StringValue price_item_code = 3;
	google.protobuf.StringValue reporting_source = 4;
	google.protobuf.StringValue client_id = 5;
	google.protobuf.StringValue client_number = 6;
	google.protobuf.StringValue client_staff_code = 7;
	google.protobuf.StringValue branch = 8;
	google.protobuf.StringValue reference1 = 9;
	google.protobuf.StringValue reference2 = 10;
	google.protobuf.StringValue reference3 = 11;
	google.protobuf.StringValue reference4 = 12;
	google.protobuf.StringValue reference5 = 13;
	google.protobuf.StringValue message_tracking_id = 14;
	google.protobuf.StringValue additional_refs = 15;
	int32 version = 16;
	google.protobuf.Timestamp service_occured_utc = 17;
}

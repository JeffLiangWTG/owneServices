<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Reference Service</title>
		<style>
			input::-webkit-calendar-picker-indicator {
				display: none;
			}
			.bg-que {
				background-color: darkgoldenrod;
			}
			.bg-prs {
				background-color: rgb(165, 214, 187);
			}
			.bg-err {
				background-color: indianred;
			}
			.bg-mer {
				background-color: rgb(146, 236, 176);
			}
			.bg-dup {
				background-color: rgb(146, 236, 176);
			}
			.bg-fie {
				background-color: lightcoral;
			}
			.bg-fin {
				background-color: mediumseagreen;
			}

			/*
			Support for sub menu on nav bar
			Sub menu has been removed since Bootstrap 3 (we are using Bootstrap 4) but you can easily add it back
			using this CSS code.
			https://stackoverflow.com/questions/18023493/bootstrap-dropdown-sub-menu-missing/18024991#18024991
			The link also contains the CSS code for the sub menu for Bootstrap 5.
			*/
			.navbar-nav li.dropdown-submenu:hover > ul.dropdown-menu {
				display: block;
			}
			.dropdown-submenu {
				position:relative;
			}
			.dropdown-submenu>.dropdown-menu {
				top:0;
				left:100%;
				margin-top:-6px;
			}
			.dropdown-submenu .dropdown-item {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
			}
			.dropdown-submenu .dropdown-item::after {
				border-top: .3em solid transparent;
				border-right: 0;
				border-bottom: .3em solid transparent;
				border-left: .3em solid;
				margin-left: .355em;
			}
		</style>
	</head>
	<body>
		<div class="container-fluid">
			<div>
				<div>
					<div id="my-app">
						<!-- form -->
					</div>
				</div>
			</div>
		</div>
	</body>
</html>

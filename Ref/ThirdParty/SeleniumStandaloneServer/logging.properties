handlers=java.util.logging.FileHandler
java.util.logging.FileHandler.pattern = logs.txt

#100M = 100 * 1024 * 1024 = 104857600 bytes 
java.util.logging.FileHandler.limit = 104857600
java.util.logging.FileHandler.count = 10
java.util.logging.FileHandler.level = WARNING
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = org.openqa.selenium.remote.server.log.TerseFormatter

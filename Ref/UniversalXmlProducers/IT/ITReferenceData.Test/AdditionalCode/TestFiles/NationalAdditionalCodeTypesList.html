var URL_KB;

function decodificaKB(tabella,codice){

	arraydistringhe = tabella.split('|');

	for(var i=0; i < arraydistringhe.length; i++){
		var cod=arraydistringhe[i];
		if (cod == codice){
			break;
		}
		++i
	}
	if(i < arraydistringhe.length){
		return arraydistringhe[++i]
	}else{
		return null;
	}
}

	function GetXmlHttpObject(){
		var xmlHttp=null;
		try{
			//browser no IE
			xmlHttp=new XMLHttpRequest();
		}catch(e){
			//IE
			try{
				xmlHttp=new ActiveXObject("Msxml2.XMLHTTP");
			}catch(ex){
				xmlHttp=new ActiveXObject("Microsoft.XMLHTTP");
			}
		}
		return xmlHttp;
	}

	function getElenco(form){
//		controllo della data
		var gg = form.gg.value;
		var mm = form.mm.value-1;
		var aaaa = form.aaaa.value;

		if (aaaa.length<4) return false;
		var d = new Date(aaaa,mm,gg);

		if (d.getDate()!=gg) return false;
		if (d.getMonth()!=mm) return false;
		if (d.getFullYear()!=aaaa) return false;

		mm++;

		xmlHttp=GetXmlHttpObject();
		if(xmlHttp==null){
			alert("Browser non supporta HTTP Request");
			return;
		}
		var url="DatiGeneraliServlet?ajax=SI&action=";

			url+="3&gg="+gg+"&mm="+mm+"&aaaa="+aaaa;


		xmlHttp.onreadystatechange=stateChangedElenco;
		xmlHttp.open("POST",url,true);
		xmlHttp.send(null);
	}

	function stateChangedElenco(){
		if(xmlHttp.readyState==4 || xmlHttp.readyState=="complete"){
			strResult=xmlHttp.responseText;
			if(strResult.indexOf("KO")>=0) {
//				alert('ERRORE');
			} else {
				var opts = document.getElementById('Elenco').options;
				opts.length = 0;
				var splt = strResult.split('|');
				for (i=0;i<splt.length; i++) {
					var opt = new Option(splt[i+1]=='_'?'':splt[i+1], splt[i]=='_'?'':splt[i]);
					opts.add(opt);
					i++;
				}
			}
		}
	}

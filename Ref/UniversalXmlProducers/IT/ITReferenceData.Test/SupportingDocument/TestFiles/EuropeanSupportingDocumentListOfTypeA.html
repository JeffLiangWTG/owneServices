    <SCRIPT>
        var URL_KB;
        var pageKB = '0000';

        function decodificaKB(tabella, codice) {

            arraydistringhe = tabella.split('|');

            for (var i = 0; i < arraydistringhe.length; i++) {
                var cod = arraydistringhe[i];
                if (cod == codice) {
                    break;
                }
                ++i
            }
            if (i < arraydistringhe.length) {
                return arraydistringhe[++i]
            } else {
                return null;
            }
        }

    <SCRIPT>
        var URL_KB;
        var pageKB = '0000';

        function decodificaKB(tabella, codice) {

            arraydistringhe = tabella.split('|');

            for (var i = 0; i < arraydistringhe.length; i++) {
                var cod = arraydistringhe[i];
                if (cod == codice) {
                    break;
                }
                ++i
            }
            if (i < arraydistringhe.length) {
                return arraydistringhe[++i]
            } else {
                return null;
            }
        }

        function leggiKB() {
            var app_URL1;
            var app_URL2;

            if (pageKB == '0000') {

                showlikemodal1("https://assistenza.agenziadogane.it/assistenza/attiva_kb_dog.asp?new,kb=Taric_Internet,solution=Taric_Internet_1,VARSET=servizio:taric_internet,templateset=tel_dogane_new");

            else {

                app_URL2 = decodificaKB(TAB_KB, pageKB);
                URL_KB = app_URL1 + app_URL2;
                showlikemodal1(URL_KB);
            }
        }

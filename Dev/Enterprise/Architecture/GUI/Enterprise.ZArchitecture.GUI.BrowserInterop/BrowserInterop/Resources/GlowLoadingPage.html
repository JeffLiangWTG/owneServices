<!DOCTYPE html>
<head>
	<style>
		.g-header:empty {
			background-color: #00a8e1;
		}

		.g-header {
			display: flex;
			width: 100%;
			height: 38px;
			flex: 1 0 38px;
			position: relative;
			z-index: 1;
		}

		#global-loading-indicator {
			display: flex;
			position: absolute;
			height: 5px;
			width: 100%;
			background-color: #79b3ff;
			overflow: hidden;
			z-index: 2;
		}

		#global-loading-indicator > div {
			padding: 0;
			margin: 0;
			content: '';
			background-color: #003479;
			width: 200px;
			height: 100%;
			will-change: transform;
			z-index: 1001;
			left: -200px;
			animation: indicatorBarMovement 2s cubic-bezier(0.97, 0.4, 0.99, 0.93) infinite;
		}

		@keyframes indicatorBarMovement {
			0% {
				transform: translateX(-200px);
			}

			100% {
				transform: translateX(8000px);
			}
		}

		* {
			padding: 0;
			margin: 0;
		}
	</style>
</head>
<body>
	<header>
		<div class="g-header g-header-loading" id="g-header-for-binding"></div>
		<div id="global-loading-indicator">
			<div></div>
		</div>
	</header>
</body>

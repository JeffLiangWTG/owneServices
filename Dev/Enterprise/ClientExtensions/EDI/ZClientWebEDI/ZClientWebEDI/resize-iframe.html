<!doctype html>
<html>
	<head>
		<script type="text/javascript" src="scripts/easyXDM.min.js"></script>
		<script type="text/javascript">
			var iframe;
			var socket = new easyXDM.Socket({
				swf: "scripts/easyxdm.swf",
				onReady : function() {
					iframe = document.createElement("iframe");
					iframe.frameBorder = 0;
					iframe.scrolling = 'no';
					document.body.appendChild(iframe);
					
					const relativeUrlPattern = /^(?!(?:[a-zA-Z]+:)?\/\/|[a-zA-Z]+:)/;
					if (relativeUrlPattern.test(easyXDM.query.url) || new URL(easyXDM.query.url).hostname === window.location.hostname)
					{
						iframe.src = easyXDM.query.url;
					}
					
					var handler = function() {
						var d = iframe.contentWindow.document;
						var originalHeight = d.body.clientHeight || d.body.offsetHeight || d.body.scrollHeight;
						var preferredHeight = originalHeight > 420 ? originalHeight : 420;
						socket.postMessage(preferredHeight);
					};

					if (iframe.attachEvent) {
						iframe.attachEvent('onload', handler);	// For IE8 and below
					} else {
						iframe.onload = handler;	// For Chrome & Firefox & IE9+
					}
				},
				onMessage : function(url, origin) {
					iframe.src = url;
				}
			});

		</script>
		<style type="text/css">
			html, body {
				overflow: hidden;
				margin: 0px;
				padding: 0px;
				width: 100%;
				height: 100%;
			}
			iframe {
				width: 100%;
				height: 100%;
				border: 0px;
			}
		</style>
	</head>
	<body></body>
</html>
